<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 0 960 140">
<rect width="960" height="140" fill="#2b2b2b" rx="6"/>
<style>
.a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:step-end}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.7s step-end infinite}
.bulb{fill:#5ec8e5;animation:bulb 1.6s step-end infinite}
.tw{animation:tw 3s step-end infinite}
@keyframes blink{0%{transform:scaleY(1)}90%{transform:scaleY(1)}92%{transform:scaleY(.15)}97%{transform:scaleY(1)}}
@keyframes bulb{0%{fill:#5ec8e5}50%{fill:#2b6a7a}}
@keyframes tw{0%{opacity:.1}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tc{fill-opacity:1!important}.alt{display:none!important}}
.sSleep{animation-name:sSleep}@keyframes sSleep{0%{opacity:1}40%{opacity:0}76%{opacity:1}}
.sAwake{animation-name:sAwake}@keyframes sAwake{0%{opacity:0}40%{opacity:1}76%{opacity:0}}
.sBang{animation-name:sBang}@keyframes sBang{0%{opacity:0}40%{opacity:1}52%{opacity:0}}
.sBub{animation-name:sBub}@keyframes sBub{0%{opacity:0}44%{opacity:1}76%{opacity:0}}
@keyframes sHop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}42%{transform:translateY(0)}}
.sHop{animation-name:sHop}
.zz{opacity:0;animation:zf 3s step-end infinite}
@keyframes zf{0%{opacity:0;transform:translate(0,12px)}20%{opacity:1;transform:translate(-4px,4px)}45%{opacity:1;transform:translate(0,-6px)}70%{opacity:.6;transform:translate(-4px,-16px)}90%{opacity:0}}
.s0{fill-opacity:0;animation:s0 12s step-end infinite}@keyframes s0{0%{fill-opacity:0}46.00%{fill-opacity:1}74%{fill-opacity:0}}.s1{fill-opacity:0;animation:s1 12s step-end infinite}@keyframes s1{0%{fill-opacity:0}48.00%{fill-opacity:1}74%{fill-opacity:0}}.s2{fill-opacity:0;animation:s2 12s step-end infinite}@keyframes s2{0%{fill-opacity:0}50.00%{fill-opacity:1}74%{fill-opacity:0}}.s3{fill-opacity:0;animation:s3 12s step-end infinite}@keyframes s3{0%{fill-opacity:0}52.00%{fill-opacity:1}74%{fill-opacity:0}}.s4{fill-opacity:0;animation:s4 12s step-end infinite}@keyframes s4{0%{fill-opacity:0}54.00%{fill-opacity:1}74%{fill-opacity:0}}.s5{fill-opacity:0;animation:s5 12s step-end infinite}@keyframes s5{0%{fill-opacity:0}56.00%{fill-opacity:1}74%{fill-opacity:0}}.s6{fill-opacity:0;animation:s6 12s step-end infinite}@keyframes s6{0%{fill-opacity:0}58.00%{fill-opacity:1}74%{fill-opacity:0}}
</style>
