<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 0 960 140">
<rect width="960" height="140" fill="#dcdcdc" rx="6"/>
<style>
.a{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:step-end}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.7s step-end infinite}
.bulb{fill:#5ec8e5;animation:bulb 1.6s step-end infinite}
.tw{animation:tw 3s step-end infinite}
@keyframes blink{0%{transform:scaleY(1)}90%{transform:scaleY(1)}92%{transform:scaleY(.15)}97%{transform:scaleY(1)}}
@keyframes bulb{0%{fill:#5ec8e5}50%{fill:#2b6a7a}}
@keyframes tw{0%{opacity:.1}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tc{fill-opacity:1!important}.alt{display:none!important}}
.mHappy{animation-name:mHappy}@keyframes mHappy{0%{opacity:0}10%{opacity:1}60%{opacity:0}}
.mCalm{animation-name:mCalm}@keyframes mCalm{0%{opacity:1}10%{opacity:0}60%{opacity:1}}
.mBub{animation-name:mBub}@keyframes mBub{0%{opacity:0}12%{opacity:1}62%{opacity:0}}
.mHeart{animation-name:mHeart}@keyframes mHeart{0%{opacity:0}28%{opacity:1}72%{opacity:0}}
.tlA{animation:tlA .9s step-end infinite}.tlB{animation:tlB .9s step-end infinite}
@keyframes tlA{0%{opacity:1}50%{opacity:0}}
@keyframes tlB{0%{opacity:0}50%{opacity:1}}
.rise{animation:rise 9s step-end infinite}@keyframes rise{0%{transform:translateY(0)}28%{transform:translateY(0)}40%{transform:translateY(-8px)}52%{transform:translateY(-16px)}64%{transform:translateY(-24px)}}
.m0{fill-opacity:0;animation:m0 9s step-end infinite}@keyframes m0{0%{fill-opacity:0}12.00%{fill-opacity:1}60%{fill-opacity:0}}.m1{fill-opacity:0;animation:m1 9s step-end infinite}@keyframes m1{0%{fill-opacity:0}15.00%{fill-opacity:1}60%{fill-opacity:0}}.m2{fill-opacity:0;animation:m2 9s step-end infinite}@keyframes m2{0%{fill-opacity:0}18.00%{fill-opacity:1}60%{fill-opacity:0}}.m3{fill-opacity:0;animation:m3 9s step-end infinite}@keyframes m3{0%{fill-opacity:0}21.00%{fill-opacity:1}60%{fill-opacity:0}}.m4{fill-opacity:0;animation:m4 9s step-end infinite}@keyframes m4{0%{fill-opacity:0}24.00%{fill-opacity:1}60%{fill-opacity:0}}
</style>
